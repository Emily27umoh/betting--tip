

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — 180SCORE</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background-image: url('images/football1.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:24px 16px;
    font-family:"Radley", serif;
  }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stadium-bg">
  <div class="pitch-lines"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
</div>

<div class="scene">
  <div class="brand">
    <div class="brand-mark"><span class="num">180</span>SCORE</div>
    <div class="brand-tag">Live odds & predictions</div>
  </div>

  <div class="flip-card" id="flipCard">

    <!-- LOGIN FACE -->
    <div class="face front">
      <div class="tabs">
        <span class="tab-pill">Log In</span>
      </div>

      <h2>Welcome back</h2>
      <p class="sub">Log in to catch today's picks.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <input type="email" id="loginEmail" placeholder=" " required>
          <label for="loginEmail">Email address</label>
        </div>

        <div class="field">
          <input type="password" id="loginPassword" placeholder=" " required minlength="6">
          <label for="loginPassword">Password</label>
          <button type="button" class="toggle-eye" data-target="loginPassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="row-between">
          <label class="remember"><input type="checkbox"> Remember me</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">
          <span class="btn-label" style="color: #fff; font-size: 20px;">Log In</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="divider">OR CONTINUE WITH</div>
      <div class="social-row">
        <button class="social-btn" type="button">
          <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.7-2.6C16.9 3 14.7 2 12 2 6.9 2 2.7 6.1 2.7 11.2S6.9 20.4 12 20.4c6.1 0 9.5-4.3 9.5-8.6 0-.6-.1-1-.2-1.6H12z"/></svg>
          Google
        </button>
        <button class="social-btn" type="button">
          <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M22 12a10 10 0 10-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0022 12z"/></svg>
          Facebook
        </button>
      </div>

      <div class="switch-line">
        New here? <button type="button" id="goRegister1">Create an account</button>
      </div>
    </div>

    <!-- REGISTER FACE -->
    <div class="face back">
      <div class="tabs">
        <span class="tab-pill">Register</span>
      </div>

      <h2>Create your account</h2>
      <p class="sub">Join to unlock live predictions.</p>

      <form id="registerForm" novalidate>
        <div class="field">
          <input type="text" id="regName" placeholder=" " required minlength="2">
          <label for="regName">Full name</label>
        </div>

        <div class="field">
          <input type="email" id="regEmail" placeholder=" " required>
          <label for="regEmail">Email address</label>
        </div>

        <div class="field">
          <input type="password" id="regPassword" placeholder=" " required minlength="6">
          <label for="regPassword">Password</label>
          <button type="button" class="toggle-eye" data-target="regPassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel">Password strength</div>

        <button type="submit" class="submit-btn">
          <span class="btn-label" style="color: #fff; font-size: 20px;">Create Account</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="switch-line">
        Already have an account? <button type="button" id="goLogin1">Log in</button>
      </div>
    </div>

  </div>
  <div class="card-shadow"></div>
</div>

<div class="success-check" id="successOverlay">
  <div class="check-circle">
    <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
  </div>
</div>

<script>
  const flipCard = document.getElementById('flipCard');
  const scene = document.querySelector('.scene');
  let isFlipping = false;

  function flipTo(target){
    // target: 'register' | 'login'
    const goingToRegister = target === 'register';
    if (isFlipping) return;
    if (goingToRegister === flipCard.classList.contains('flipped')) return;

    isFlipping = true;
    scene.classList.add('is-flipping');
    flipCard.classList.add('flipping');

    setTimeout(() => {
      flipCard.classList.toggle('flipped', goingToRegister);
      flipCard.classList.remove('flipping');
      setTimeout(() => {
        scene.classList.remove('is-flipping');
        isFlipping = false;
      }, 450);
    }, 200);
  }

  function showRegister(){ flipTo('register'); }
  function showLogin(){ flipTo('login'); }

  document.getElementById('goRegister1').addEventListener('click', showRegister);
  document.getElementById('goLogin1').addEventListener('click', showLogin);

  // Password visibility toggle
  document.querySelectorAll('.toggle-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });
  });

  // Password strength meter
  const regPassword = document.getElementById('regPassword');
  const strengthFill = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');

  regPassword.addEventListener('input', () => {
    const val = regPassword.value;
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
    if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { pct: 0,   color: 'var(--red)',   label: 'Password strength' },
      { pct: 25,  color: 'var(--red)',   label: 'Weak' },
      { pct: 55,  color: '#f5d90a',      label: 'Okay' },
      { pct: 80,  color: '#f5d90a',      label: 'Good' },
      { pct: 100, color: 'var(--green)', label: 'Strong' }
    ];
    const level = levels[val.length === 0 ? 0 : score];
    strengthFill.style.width = level.pct + '%';
    strengthFill.style.background = level.color;
    strengthLabel.textContent = level.label;
    strengthLabel.style.color = val.length === 0 ? 'var(--text-faint)' : level.color;
  });

  // Fake submit flow with loading + success animation
  function handleSubmit(form){
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!form.checkValidity()){
        form.reportValidity();
        return;
      }
      const btn = form.querySelector('.submit-btn');
      btn.classList.add('loading');
      btn.disabled = true;

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.disabled = false;
        const overlay = document.getElementById('successOverlay');
        overlay.classList.add('show');
        setTimeout(() => overlay.classList.remove('show'), 1400);
      }, 1200);
    });
  }
  handleSubmit(document.getElementById('loginForm'));
  handleSubmit(document.getElementById('registerForm'));
</script>

</body>
</html>
